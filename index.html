<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Streamlit PDF Studio</title>
  </head>
  <body>
    <!-- The Streamlit app will load inside this div -->
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
      
      mount(
        {
          // Tell the browser to install pypdf via WebAssembly
          requirements: ["pypdf"],
          entrypoint: "app.py",
          files: {
            // Your entire Python script goes inside these backticks
            "app.py": `
import streamlit as st
from pypdf import PdfReader, PdfWriter
import io

st.set_page_config(page_title="PDF Studio", page_icon="📄")
st.title("📄 PDF Studio (Serverless Edition)")
st.write("This Streamlit app is running 100% in your browser using WebAssembly!")

tool = st.sidebar.radio("Select Tool:", ["Merge PDFs", "Split Pages", "Rotate Pages"])

if tool == "Merge PDFs":
    st.header("Merge Multiple PDFs")
    uploaded_files = st.file_uploader("Upload PDFs", type="pdf", accept_multiple_files=True)
    if uploaded_files and len(uploaded_files) > 1 and st.button("Merge PDFs"):
        writer = PdfWriter()
        for file in uploaded_files:
            writer.append(file)
        
        buffer = io.BytesIO()
        writer.write(buffer)
        buffer.seek(0)
        
        st.success("Merged successfully!")
        st.download_button("⬇️ Download Merged PDF", buffer, "merged.pdf", "application/pdf")

elif tool == "Split Pages":
    st.header("Extract Pages")
    uploaded_file = st.file_uploader("Upload PDF", type="pdf")
    if uploaded_file:
        reader = PdfReader(uploaded_file)
        start_page = st.number_input("Start", 1, len(reader.pages), 1)
        end_page = st.number_input("End", 1, len(reader.pages), len(reader.pages))
        
        if st.button("Extract"):
            writer = PdfWriter()
            for i in range(start_page - 1, end_page):
                writer.add_page(reader.pages[i])
            buffer = io.BytesIO()
            writer.write(buffer)
            buffer.seek(0)
            st.download_button("⬇️ Download Pages", buffer, "extracted.pdf", "application/pdf")

elif tool == "Rotate Pages":
    st.header("Rotate Pages")
    uploaded_file = st.file_uploader("Upload PDF", type="pdf")
    if uploaded_file:
        angle = st.selectbox("Angle", [90, 180, 270])
        if st.button("Rotate"):
            reader = PdfReader(uploaded_file)
            writer = PdfWriter()
            for page in reader.pages:
                page.rotate(angle)
                writer.add_page(page)
            buffer = io.BytesIO()
            writer.write(buffer)
            buffer.seek(0)
            st.download_button("⬇️ Download Rotated PDF", buffer, "rotated.pdf", "application/pdf")
`
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
